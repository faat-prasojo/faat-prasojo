name: Update README

on:
  schedule:
    - cron: "0 0 * * *"   # Jalan tiap hari jam 00:00 UTC
  push:
    branches: [main]
  workflow_dispatch:       # Bisa trigger manual dari tab Actions

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Wajib agar bisa push perubahan README

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/update_readme.py

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: auto-update README [skip ci]"
          git push